{% extends "client/base.html" %}

{% block title %}发布文章 - 师备云{% endblock %}

{% block content %}
<style>
    .publish-container {
        max-width: 900px;
        margin: 0 auto;
    }
    .publish-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        padding: 40px;
    }
    .publish-header {
        text-align: center;
        margin-bottom: 40px;
        padding-bottom: 30px;
        border-bottom: 2px solid #f0f0f0;
    }
    .publish-header i {
        font-size: 3rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .publish-header h2 {
        margin-top: 15px;
        font-weight: 700;
        color: #333;
    }
    .publish-header p {
        color: #999;
        margin-top: 10px;
    }
    .form-label {
        font-weight: 600;
        color: #555;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .form-label i {
        color: #667eea;
    }
    .form-control, .form-select {
        border: 2px solid #eee;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 15px;
        transition: all 0.3s;
    }
    .form-control:focus, .form-select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    textarea.form-control {
        min-height: 250px;
        resize: vertical;
        line-height: 1.8;
    }
    .type-selector {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }
    .type-option {
        flex: 1;
        min-width: 120px;
        padding: 20px 15px;
        border: 2px solid #eee;
        border-radius: 12px;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s;
        background: white;
    }
    .type-option:hover {
        border-color: #667eea;
        background: #f8f9ff;
    }
    .type-option input {
        display: none;
    }
    .type-option input:checked + .type-content {
        color: #667eea;
    }
    .type-option:has(input:checked) {
        border-color: #667eea;
        background: linear-gradient(135deg, #667eea08 0%, #764ba208 100%);
    }
    .type-content i {
        font-size: 1.8rem;
        margin-bottom: 8px;
        display: block;
    }
    .type-content span {
        font-weight: 600;
        font-size: 14px;
    }
    .publish-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 15px 40px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 16px;
        color: white;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    .publish-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        color: white;
    }
    .cancel-btn {
        background: #f5f5f5;
        border: none;
        padding: 15px 30px;
        border-radius: 30px;
        font-weight: 600;
        color: #666;
        cursor: pointer;
        transition: all 0.3s;
    }
    .cancel-btn:hover {
        background: #eee;
        color: #333;
    }
    .action-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 2px solid #f0f0f0;
    }
    .tip-box {
        background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        display: flex;
        align-items: flex-start;
        gap: 15px;
    }
    .tip-box i {
        font-size: 1.5rem;
        color: #667eea;
        flex-shrink: 0;
    }
    .tip-box p {
        margin: 0;
        color: #666;
        font-size: 14px;
        line-height: 1.7;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .publish-card {
        animation: fadeIn 0.5s ease;
    }
    .cover-upload-area {
        border: 2px dashed #ddd;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: #fafafa;
    }
    .cover-upload-area:hover {
        border-color: #667eea;
        background: #f8f9ff;
    }
    .cover-upload-area.has-image {
        padding: 15px;
    }
    .cover-preview {
        max-width: 100%;
        max-height: 300px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .cover-upload-icon {
        font-size: 3rem;
        color: #ddd;
        margin-bottom: 15px;
    }
    .cover-upload-text {
        color: #999;
        font-size: 14px;
    }
    .content-toolbar {
        border: 2px solid #eee;
        border-bottom: none;
        border-radius: 12px 12px 0 0;
        padding: 10px 15px;
        background: #fafafa;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .toolbar-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        font-size: 18px;
        color: #555;
    }
    .toolbar-btn:hover {
        background: #667eea;
        color: white;
    }
    .toolbar-divider {
        width: 1px;
        background: #ddd;
        margin: 0 5px;
    }
    #content-editor {
        border-radius: 0 0 12px 12px;
    }
    #content-editor:focus {
        border-color: #667eea;
    }
    .image-url-input {
        margin-top: 10px;
        display: none;
    }
    .image-url-input.show {
        display: block;
    }
</style>

<div class="publish-container">
    <div class="publish-card">
        <div class="publish-header">
            <i class="bi bi-pencil-square"></i>
            <h2>发布新文章</h2>
            <p>分享您的教学心得和经验</p>
        </div>

        <form method="post" id="publish-form">
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-card-heading"></i> 文章标题</label>
                <input type="text" name="title" class="form-control" placeholder="请输入文章标题" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-tag"></i> 文章类型</label>
                <div class="type-selector">
                    <label class="type-option">
                        <input type="radio" name="post_type" value="note" checked>
                        <div class="type-content">
                            <i class="bi bi-journal-text"></i>
                            <span>教学笔记</span>
                        </div>
                    </label>
                    <label class="type-option">
                        <input type="radio" name="post_type" value="resource">
                        <div class="type-content">
                            <i class="bi bi-book"></i>
                            <span>教育资源</span>
                        </div>
                    </label>
                    <label class="type-option">
                        <input type="radio" name="post_type" value="experience">
                        <div class="type-content">
                            <i class="bi bi-lightbulb"></i>
                            <span>教育心得</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-folder"></i> 所属分类</label>
                <select name="category_id" class="form-select" required>
                    <option value="">请选择分类</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-image"></i> 文章封面</label>
                <input type="hidden" name="cover_image" id="cover_image" value="">
                <div class="cover-upload-area" id="cover-upload-area" onclick="document.getElementById('cover-input').click()">
                    <div id="cover-placeholder">
                        <i class="bi bi-cloud-upload cover-upload-icon"></i>
                        <p class="cover-upload-text">点击上传封面图片（建议尺寸 800x400）</p>
                    </div>
                    <img id="cover-preview" class="cover-preview" style="display: none;">
                </div>
                <input type="file" id="cover-input" accept="image/*" style="display: none;" onchange="handleCoverUpload(this)">
                <div class="mt-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="removeCover()">
                        <i class="bi bi-x"></i> 移除封面
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-text-paragraph"></i> 文章摘要</label>
                <textarea name="summary" class="form-control" rows="3" placeholder="简要描述文章内容，让读者快速了解..."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-file-text"></i> 文章内容</label>
                <div class="tip-box">
                    <i class="bi bi-info-circle"></i>
                    <p>建议使用 Markdown 格式书写，可以更好地展示文章结构。支持代码块、列表、粗体斜体等常用格式。支持粘贴或拖拽上传图片。</p>
                </div>
                
                <div class="content-toolbar">
                    <button type="button" class="toolbar-btn" onclick="insertImage()" title="插入图片">
                        <i class="bi bi-image"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="insertFormat('**', '**')" title="粗体">
                        <i class="bi bi-type-bold"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="insertFormat('*', '*')" title="斜体">
                        <i class="bi bi-type-italic"></i>
                    </button>
                    <div class="toolbar-divider"></div>
                    <button type="button" class="toolbar-btn" onclick="insertFormat('## ', '')" title="标题">
                        <i class="bi bi-type-h1"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="insertFormat('- ', '')" title="列表">
                        <i class="bi bi-list-ul"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="insertFormat('```\n', '\n```')" title="代码块">
                        <i class="bi bi-code"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="insertFormat('[', '](url)')" title="链接">
                        <i class="bi bi-link"></i>
                    </button>
                </div>
                <textarea name="content" class="form-control" id="content-editor" placeholder="在这里输入文章内容..." required></textarea>
                
                <div class="image-url-input" id="image-url-input">
                    <div class="input-group">
                        <input type="file" class="form-control" id="content-image-input" accept="image/*">
                        <button class="btn btn-outline-primary" type="button" onclick="uploadContentImage()">上传</button>
                    </div>
                    <small class="text-muted">或直接粘贴/拖拽图片到编辑器中</small>
                </div>
            </div>

            <div class="mb-4">
                <div class="form-check">
                    <input type="checkbox" name="is_published" class="form-check-input" id="is_published" checked>
                    <label class="form-check-label" for="is_published">
                        <strong>立即发布</strong>（取消勾选则保存为草稿）
                    </label>
                </div>
            </div>

            <div class="action-buttons">
                <a href="{{ url_for('client.index') }}" class="cancel-btn">
                    <i class="bi bi-x-lg"></i> 取消
                </a>
                <button type="submit" class="publish-btn">
                    <i class="bi bi-send"></i> 发布文章
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const contentEditor = document.getElementById('content-editor');
    const imageUrlInput = document.getElementById('image-url-input');

    function handleCoverUpload(input) {
        const file = input.files[0];
        if (file) {
            const formData = new FormData();
            formData.append('image', file);
            
            fetch('/upload/image', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.url) {
                    document.getElementById('cover_image').value = data.url;
                    document.getElementById('cover-preview').src = data.url;
                    document.getElementById('cover-preview').style.display = 'block';
                    document.getElementById('cover-placeholder').style.display = 'none';
                    document.getElementById('cover-upload-area').classList.add('has-image');
                } else {
                    alert('上传失败：' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                console.error('上传失败:', error);
                alert('上传失败，请重试');
            });
        }
    }

    function removeCover() {
        document.getElementById('cover_image').value = '';
        document.getElementById('cover-preview').src = '';
        document.getElementById('cover-preview').style.display = 'none';
        document.getElementById('cover-placeholder').style.display = 'block';
        document.getElementById('cover-upload-area').classList.remove('has-image');
        document.getElementById('cover-input').value = '';
    }

    function insertFormat(before, after) {
        const start = contentEditor.selectionStart;
        const end = contentEditor.selectionEnd;
        const text = contentEditor.value;
        const selected = text.substring(start, end);
        
        contentEditor.value = text.substring(0, start) + before + selected + after + text.substring(end);
        contentEditor.focus();
        contentEditor.selectionStart = start + before.length;
        contentEditor.selectionEnd = end + before.length;
    }

    function insertImage() {
        imageUrlInput.classList.toggle('show');
        if (imageUrlInput.classList.contains('show')) {
            document.getElementById('content-image-input').focus();
        }
    }

    function uploadContentImage() {
        const input = document.getElementById('content-image-input');
        const file = input.files[0];
        
        if (!file) {
            alert('请先选择图片');
            return;
        }
        
        const formData = new FormData();
        formData.append('image', file);
        
        fetch('/upload/image', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.url) {
                const markdownImage = `![${file.name}](${data.url})`;
                insertFormat(markdownImage, '');
                imageUrlInput.classList.remove('show');
                input.value = '';
            } else {
                alert('上传失败：' + (data.error || '未知错误'));
            }
        })
        .catch(error => {
            console.error('上传失败:', error);
            alert('上传失败，请重试');
        });
    }

    contentEditor.addEventListener('paste', function(e) {
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                e.preventDefault();
                const file = items[i].getAsFile();
                const formData = new FormData();
                formData.append('image', file);
                
                fetch('/upload/image', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.url) {
                        const markdownImage = `![${file.name}](${data.url})`;
                        insertFormat(markdownImage, '');
                    }
                })
                .catch(error => {
                    console.error('粘贴上传失败:', error);
                });
                break;
            }
        }
    });

    contentEditor.addEventListener('drop', function(e) {
        e.preventDefault();
        const files = e.dataTransfer.files;
        for (let i = 0; i < files.length; i++) {
            if (files[i].type.indexOf('image') !== -1) {
                const file = files[i];
                const formData = new FormData();
                formData.append('image', file);
                
                fetch('/upload/image', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.url) {
                        const markdownImage = `![${file.name}](${data.url})\n`;
                        insertFormat(markdownImage, '');
                    }
                })
                .catch(error => {
                    console.error('拖拽上传失败:', error);
                });
                break;
            }
        }
    });

    document.getElementById('publish-form').addEventListener('submit', function(e) {
        if (!document.getElementById('cover_image').value) {
            document.getElementById('cover_image').value = '';
        }
    });
</script>
{% endblock %}
