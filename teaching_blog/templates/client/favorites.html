{% extends "client/base.html" %}

{% block title %}我的收藏 - 师备云{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="text-center mb-2">
                    <i class="bi bi-star-fill text-warning"></i> 我的收藏
                </h2>
                <p class="text-center text-muted">收藏您喜欢的文章和资源</p>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div id="loadingState" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">加载中...</p>
                </div>

                <div id="emptyState" class="text-center py-5" style="display: none;">
                    <i class="bi bi-star" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="mt-3 text-muted">还没有收藏任何文章</p>
                    <a href="{{ url_for('client.index') }}" class="btn btn-primary">去逛逛</a>
                </div>

                <div id="favoritesList" style="display: none;">
                    <div class="row" id="favoritesContainer"></div>

                    <nav aria-label="Page navigation" class="mt-4">
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadFavorites(1);
});

async function loadFavorites(page) {
    currentPage = page;
    showLoading();

    try {
        const response = await fetch(`/api/favorites?page=${page}`);
        const data = await response.json();

        if (data.error) {
            showEmpty();
            return;
        }

        renderFavorites(data);
    } catch (error) {
        showEmpty();
    }
}

function renderFavorites(data) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('favoritesList').style.display = 'block';

    const container = document.getElementById('favoritesContainer');

    if (!data.favorites || data.favorites.length === 0) {
        showEmpty();
        return;
    }

    container.innerHTML = data.favorites.map(favorite => `
        <div class="col-md-6 mb-4 favorite-item" data-id="${favorite.id}">
            <div class="card h-100">
                <div class="row g-0">
                    <div class="col-md-4">
                        ${favorite.cover_image
                            ? `<img src="${favorite.cover_image}" class="img-fluid rounded-start h-100" style="object-fit: cover; min-height: 150px;" alt="${favorite.title}">`
                            : `<div class="bg-secondary d-flex align-items-center justify-content-center h-100" style="min-height: 150px;">
                                <i class="bi bi-image text-white" style="font-size: 2rem;"></i>
                               </div>`
                        }
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h6 class="card-title">
                                <a href="/post/${favorite.slug}" class="text-decoration-none text-dark">
                                    ${favorite.title}
                                </a>
                            </h6>
                            <p class="card-text small text-muted">${favorite.summary ? favorite.summary.substring(0, 60) + '...' : ''}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="text-muted">${favorite.created_at}</small>
                                <button class="btn btn-sm btn-outline-danger" onclick="removeFavorite(${favorite.id})">
                                    <i class="bi bi-trash"></i> 取消收藏
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');

    renderPagination(data);
}

function renderPagination(data) {
    const pagination = document.getElementById('pagination');

    if (data.pages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';

    if (data.pages > 1) {
        html += `<li class="page-item ${data.pages === 1 ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="loadFavorites(${currentPage - 1})">上一页</a>
        </li>`;
    }

    for (let i = 1; i <= data.pages; i++) {
        if (i === 1 || i === data.pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="loadFavorites(${i})">${i}</a>
            </li>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
    }

    if (data.pages > 1) {
        html += `<li class="page-item ${currentPage === data.pages ? 'disabled' : ''}">
            <a class="page-link" href="javascript:void(0)" onclick="loadFavorites(${currentPage + 1})">下一页</a>
        </li>`;
    }

    pagination.innerHTML = html;
}

async function removeFavorite(postId) {
    if (!confirm('确定要取消收藏吗？')) return;

    try {
        const response = await fetch(`/api/favorites/${postId}`, { method: 'POST' });
        const data = await response.json();

        if (data.status === 'removed') {
            const item = document.querySelector(`.favorite-item[data-id="${postId}"]`);
            if (item) {
                item.style.transition = 'opacity 0.3s';
                item.style.opacity = '0';
                setTimeout(() => {
                    item.remove();
                    loadFavorites(currentPage);
                }, 300);
            }
        }
    } catch (error) {
        alert('操作失败，请稍后重试');
    }
}

function showLoading() {
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('favoritesList').style.display = 'none';
}

function showEmpty() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('favoritesList').style.display = 'none';
}
</script>
{% endblock %}
