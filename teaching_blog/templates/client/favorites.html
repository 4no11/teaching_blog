{% extends "client/base.html" %}

{% block title %}我的收藏 - 师备云{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header-section">
        <div class="header-icon-wrapper">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="#1976d2" stroke="none">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        </div>
        <h1 class="page-main-title">我的收藏</h1>
        <p class="page-subtitle">收藏您喜欢的文章和资源</p>
    </div>

    <div class="main-content-card">
        <div id="loadingState" class="loading-state">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#90a4ae" stroke-width="1.5">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            <h3>还没有收藏任何文章</h3>
            <p>去发现感兴趣的内容吧</p>
            <a href="{{ url_for('client.index') }}" class="btn-primary-custom">去逛逛</a>
        </div>

        <div id="favoritesList" style="display: none;">
            <div class="favorites-grid" id="favoritesContainer"></div>

            <nav aria-label="Page navigation" class="pagination-wrapper">
                <ul class="pagination-custom" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadFavorites(1);
});

async function loadFavorites(page) {
    currentPage = page;
    showLoading();

    try {
        const response = await fetch(`/api/favorites?page=${page}`);
        const data = await response.json();

        if (data.error) {
            showEmpty();
            return;
        }

        renderFavorites(data);
    } catch (error) {
        showEmpty();
    }
}

function renderFavorites(data) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('favoritesList').style.display = 'block';

    const container = document.getElementById('favoritesContainer');

    if (!data.favorites || data.favorites.length === 0) {
        showEmpty();
        return;
    }

    container.innerHTML = data.favorites.map(favorite => `
        <div class="favorite-card" data-id="${favorite.id}">
            <div class="favorite-cover">
                ${favorite.cover_image
                    ? `<img src="${favorite.cover_image}" alt="${favorite.title}">`
                    : `<div class="cover-placeholder">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                       </div>`
                }
                <div class="cover-overlay">
                    <button class="btn-remove" onclick="removeFavorite(${favorite.id})" title="取消收藏">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4h4v2"/></svg>
                    </button>
                </div>
            </div>
            <div class="favorite-content">
                <h3 class="favorite-title">
                    <a href="/post/${favorite.slug}">${favorite.title}</a>
                </h3>
                <p class="favorite-summary">${favorite.summary ? favorite.summary.substring(0, 120) + '...' : ''}</p>
                <div class="favorite-meta">
                    <span class="meta-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        ${favorite.created_at}
                    </span>
                </div>
            </div>
        </div>
    `).join('');

    renderPagination(data);
}

function renderPagination(data) {
    const pagination = document.getElementById('pagination');

    if (data.pages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';

    html += `<li class="${currentPage === 1 ? 'disabled' : ''}">
        <a href="javascript:void(0)" onclick="loadFavorites(${currentPage - 1})">← 上一页</a>
    </li>`;

    for (let i = 1; i <= data.pages; i++) {
        if (i === 1 || i === data.pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            html += `<li class="${i === currentPage ? 'active' : ''}">
                <a href="javascript:void(0)" onclick="loadFavorites(${i})">${i}</a>
            </li>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += `<li class="disabled"><span>...</span></li>`;
        }
    }

    html += `<li class="${currentPage === data.pages ? 'disabled' : ''}">
        <a href="javascript:void(0)" onclick="loadFavorites(${currentPage + 1})">下一页 →</a>
    </li>`;

    pagination.innerHTML = html;
}

async function removeFavorite(postId) {
    const card = document.querySelector(`.favorite-card[data-id="${postId}"]`);

    card.style.transition = 'all 0.3s ease';
    card.style.opacity = '0.5';
    card.style.transform = 'scale(0.95)';

    try {
        const response = await fetch(`/api/favorites/${postId}`, { method: 'POST' });
        const data = await response.json();

        if (data.status === 'removed') {
            card.style.transform = 'translateX(-100%)';
            card.style.opacity = '0';

            setTimeout(() => {
                card.remove();
                loadFavorites(currentPage);
            }, 300);
        } else {
            card.style.opacity = '1';
            card.style.transform = 'scale(1)';
        }
    } catch (error) {
        card.style.opacity = '1';
        card.style.transform = 'scale(1)';
    }
}

function showLoading() {
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('favoritesList').style.display = 'none';
}

function showEmpty() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('favoritesList').style.display = 'none';
}
</script>

<style>
:root {
    --blue-primary: #1976d2;
    --blue-deep: #0d47a1;
    --gray-dark: #2c3e50;
    --gray-medium: #546e7a;
    --gray-light: #90a4ae;
    --gray-pale: #eceff1;
    --white-pure: #ffffff;
}

.page-container {
    max-width: 1200px;
    margin: 100px auto 60px;
    padding: 0 24px;
}

.page-header-section {
    text-align: center;
    margin-bottom: 40px;
}

.header-icon-wrapper {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #ffa000, #ff6f00);
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(255, 111, 0, 0.25);
}

.page-main-title {
    font-size: 32px;
    font-weight: 700;
    color: var(--gray-dark);
    letter-spacing: -0.02em;
    margin-bottom: 12px;
}

.page-subtitle {
    font-size: 15px;
    color: var(--gray-medium);
    line-height: 1.6;
}

.main-content-card {
    background: var(--white-pure);
    border-radius: 20px;
    box-shadow: 0 4px 6px rgba(38, 50, 56, 0.04),
                0 12px 40px rgba(38, 50, 56, 0.08);
    padding: 36px;
    border: 1px solid rgba(144, 164, 174, 0.12);
}

.loading-state {
    text-align: center;
    padding: 60px 20px;
}

.loading-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--gray-pale);
    border-top-color: var(--blue-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.empty-state {
    text-align: center;
    padding: 80px 20px;
}

.empty-state svg {
    margin-bottom: 20px;
    opacity: 0.5;
}

.empty-state h3 {
    font-size: 20px;
    font-weight: 600;
    color: var(--gray-dark);
    margin: 0 0 8px 0;
}

.empty-state p {
    font-size: 14px;
    color: var(--gray-medium);
    margin: 0 0 24px 0;
}

.btn-primary-custom {
    display: inline-block;
    padding: 12px 28px;
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-deep));
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px rgba(25, 118, 210, 0.3);
    text-decoration: none;
}

.btn-primary-custom:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(25, 118, 210, 0.42);
}

.favorites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
}

.favorite-card {
    background: var(--white-pure);
    border: 1.5px solid var(--gray-pale);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
}

.favorite-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 32px rgba(38, 50, 56, 0.12);
    border-color: #ffa000;
}

.favorite-cover {
    position: relative;
    height: 200px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--gray-light), var(--gray-medium));
}

.favorite-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.favorite-card:hover .favorite-cover img {
    transform: scale(1.08);
}

.cover-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-deep));
    display: flex;
    align-items: center;
    justify-content: center;
}

.cover-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 16px;
}

.favorite-card:hover .cover-overlay {
    opacity: 1;
}

.btn-remove {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d32f2f;
    transition: all 0.25s ease;
}

.btn-remove:hover {
    background: #d32f2f;
    color: white;
    transform: scale(1.1);
}

.favorite-content {
    padding: 20px;
}

.favorite-title {
    margin: 0 0 12px 0;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
}

.favorite-title a {
    color: var(--gray-dark);
    text-decoration: none;
    transition: color 0.25s ease;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.favorite-title a:hover {
    color: var(--blue-primary);
}

.favorite-summary {
    font-size: 14px;
    color: var(--gray-medium);
    line-height: 1.6;
    margin: 0 0 16px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.favorite-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-pale);
}

.meta-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--gray-light);
    font-weight: 500;
}

.pagination-wrapper {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--gray-pale);
}

.pagination-custom {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0;
    margin: 0;
}

.pagination-custom li a,
.pagination-custom li span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 40px;
    padding: 0 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-medium);
    text-decoration: none;
    transition: all 0.25s ease;
    border: 1.5px solid transparent;
}

.pagination-custom li a:hover:not(:disabled) {
    color: var(--blue-primary);
    background: rgba(25, 118, 210, 0.06);
    border-color: var(--blue-primary);
}

.pagination-custom li.active span {
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-deep));
    color: white;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
}

.pagination-custom li.disabled span {
    color: var(--gray-light);
    opacity: 0.5;
    cursor: not-allowed;
}

@media (max-width: 768px) {
    .page-container {
        margin: 80px auto 40px;
        padding: 0 16px;
    }

    .main-content-card {
        padding: 24px 20px;
    }

    .page-main-title {
        font-size: 26px;
    }

    .favorites-grid {
        grid-template-columns: 1fr;
    }

    .favorite-cover {
        height: 180px;
    }

    .pagination-custom {
        flex-wrap: wrap;
    }
}
</style>
{% endblock %}
