{% extends "client/base.html" %}

{% block title %}阅读历史 - 师备云{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="text-center mb-2">
                    <i class="bi bi-clock-history text-primary"></i> 阅读历史
                </h2>
                <p class="text-center text-muted">记录您的学习轨迹，方便回顾</p>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div id="loadingState" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">加载中...</p>
                </div>

                <div id="emptyState" class="text-center py-5" style="display: none;">
                    <i class="bi bi-clock" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="mt-3 text-muted">还没有阅读任何文章</p>
                    <a href="{{ url_for('client.index') }}" class="btn btn-primary">去逛逛</a>
                </div>

                <div id="historyList" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted small" id="historyCount"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearAllHistory()" id="clearAllBtn" style="display: none;">
                            <i class="bi bi-trash"></i> 清空历史
                        </button>
                    </div>
                    <div class="list-group" id="historyContainer"></div>

                    <nav aria-label="Page navigation" class="mt-4">
                        <ul class="pagination justify-content-center" id="pagination"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadReadingHistory(1);
});

async function loadReadingHistory(page) {
    currentPage = page;
    showLoading();

    try {
        const response = await fetch(`/api/reading-history?page=${page}`);
        const data = await response.json();

        if (data.error) {
            showEmpty();
            return;
        }

        renderReadingHistory(data);
    } catch (error) {
        showEmpty();
    }
}

function renderReadingHistory(data) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('historyList').style.display = 'block';

    const container = document.getElementById('historyContainer');

    if (!data.history || data.history.length === 0) {
        showEmpty();
        return;
    }

    document.getElementById('historyCount').textContent = `共 ${data.total} 条记录`;

    if (data.total > 0) {
        document.getElementById('clearAllBtn').style.display = 'inline-block';
    }

    container.innerHTML = data.history.map(item => `
        <div class="list-group-item history-item" data-id="${item.id}">
            <div class="row align-items-center">
                <div class="col-md-2 col-3">
                    ${item.cover_image
                        ? `<img src="${item.cover_image}" class="img-fluid rounded" alt="${item.title}" style="max-height: 80px; object-fit: cover;">`
                        : `<div class="bg-secondary d-flex align-items-center justify-content-center rounded" style="height: 80px;">
                            <i class="bi bi-image text-white" style="font-size: 1.5rem;"></i>
                           </div>`
                    }
                </div>
                <div class="col-md-7 col-9">
                    <h6 class="mb-1">
                        <a href="/post/${item.slug}" class="text-decoration-none text-dark">
                            ${item.title}
                        </a>
                    </h6>
                    <p class="mb-1 text-muted small">${item.summary ? item.summary.substring(0, 80) + '...' : ''}</p>
                    <small class="text-muted">
                        <i class="bi bi-clock"></i> ${item.read_at}
                        ${item.read_duration > 0 ? `<span class="ms-2"><i class="bi bi-hourglass-split"></i> 约${Math.round(item.read_duration / 60)}分钟</span>` : ''}
                    </small>
                </div>
                <div class="col-md-3 col-12 text-md-end mt-2 mt-md-0">
                    <a href="/post/${item.slug}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-arrow-repeat"></i> 继续阅读
                    </a>
                    <button class="btn btn-sm btn-outline-secondary" onclick="removeHistory(${item.id})">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    `).join('');

    renderPagination(data);
}

function renderPagination(data) {
    const pagination = document.getElementById('pagination');

    if (data.pages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';

    if (data.current_page > 1) {
        html += `<li class="page-item">
            <a class="page-link" href="javascript:void(0)" onclick="loadReadingHistory(${currentPage - 1})">上一页</a>
        </li>`;
    }

    for (let i = 1; i <= data.pages; i++) {
        if (i === 1 || i === data.pages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <a class="page-link" href="javascript:void(0)" onclick="loadReadingHistory(${i})">${i}</a>
            </li>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        }
    }

    if (data.current_page < data.pages) {
        html += `<li class="page-item">
            <a class="page-link" href="javascript:void(0)" onclick="loadReadingHistory(${currentPage + 1})">下一页</a>
        </li>`;
    }

    pagination.innerHTML = html;
}

async function removeHistory(historyId) {
    try {
        const response = await fetch(`/api/reading-history/${historyId}`, {
            method: 'DELETE'
        });
        const data = await response.json();

        if (data.success) {
            loadReadingHistory(currentPage);
        }
    } catch (error) {
    }
}

async function clearAllHistory() {
    if (!confirm('确定要清空所有阅读历史吗？此操作不可恢复。')) {
        return;
    }

    try {
        const response = await fetch('/api/reading-history/clear', {
            method: 'POST'
        });
        const data = await response.json();

        if (data.success) {
            showEmpty();
        }
    } catch (error) {
    }
}

function showLoading() {
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('historyList').style.display = 'none';
}

function showEmpty() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('historyList').style.display = 'none';
}
</script>
{% endblock %}
